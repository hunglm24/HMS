<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="100%" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      .title { font: 800 30px Arial, sans-serif; fill: #10203a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #5b6b82; }
      .section { font: 700 18px Arial, sans-serif; fill: #22324a; }
      .label { font: 700 13px Arial, sans-serif; fill: #31445f; }
      .text { font: 400 13px Arial, sans-serif; fill: #5a6a7f; }
      .roomNum { font: 800 16px Arial, sans-serif; fill: #10203a; }
      .roomType { font: 700 11px Arial, sans-serif; fill: #5b6b82; letter-spacing: 0.8px; }
      .roomMeta { font: 400 12px Arial, sans-serif; fill: #5b6b82; }
      .floorLabel { font: 800 20px Arial, sans-serif; fill: #ffffff; }
      .floorSub { font: 400 12px Arial, sans-serif; fill: rgba(255,255,255,0.88); }
      .legendText { font: 600 13px Arial, sans-serif; fill: #42546d; }
      .small { font: 400 12px Arial, sans-serif; fill: #6b7a90; }
      .panel { fill: #ffffff; stroke: #d7e0ee; stroke-width: 2; rx: 22; ry: 22; }
      .softPanel { fill: url(#cardGrad); stroke: #d7e0ee; stroke-width: 2; rx: 18; ry: 18; }
      .roomBase { stroke: #cfd9e8; stroke-width: 2; rx: 14; ry: 14; }
      .roomAvail { fill: #eef4ff; }
      .roomOcc { fill: #fff2e8; }
      .roomClean { fill: #eefdf5; }
      .roomMaint { fill: #f5f7fb; }
      .floorBar1 { fill: #2663eb; rx: 18; ry: 18; }
      .floorBar2 { fill: #0f9d58; rx: 18; ry: 18; }
      .floorBar3 { fill: #a855f7; rx: 18; ry: 18; }
      .floorBar4 { fill: #f59e0b; rx: 18; ry: 18; }
      .chip { fill: #eef4ff; stroke: #c9d8f7; stroke-width: 1.5; rx: 999; ry: 999; }
      .chipText { font: 700 12px Arial, sans-serif; fill: #2b5fd9; }
      .statusAvail { fill: #16a34a; }
      .statusOcc { fill: #ef4444; }
      .statusClean { fill: #f59e0b; }
      .statusMaint { fill: #8b5cf6; }
      .mutedLine { stroke: #d8e1ef; stroke-width: 2; }
      .dropdownField { fill: #ffffff; stroke: #cfd9e8; stroke-width: 2; rx: 12; ry: 12; }
      .dropdownHint { font: 700 11px Arial, sans-serif; fill: #7c8ba0; letter-spacing: 0.5px; }
      .dropdownValue { font: 700 13px Arial, sans-serif; fill: #21314a; }
      .btnPrimary { fill: #2563eb; rx: 12; ry: 12; }
      .btnSecondary { fill: #ffffff; stroke: #cfd9e8; stroke-width: 2; rx: 12; ry: 12; }
      .btnText { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .btnTextDark { font: 700 13px Arial, sans-serif; fill: #2563eb; }
