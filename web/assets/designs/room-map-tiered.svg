  <rect x="0" y="0" width="1600" height="980" fill="url(#bgGrad)"/>
  <circle cx="1470" cy="110" r="118" fill="#dce8ff" opacity="0.32"/>
  <circle cx="128" cy="876" r="148" fill="#d8f5e8" opacity="0.24"/>

  <text x="64" y="68" class="title">Sơ đồ phòng theo tầng</text>
  <text x="64" y="95" class="subtitle">Bố cục gọn hơn, lọc nhanh theo tầng, loại phòng và trạng thái.</text>

  <rect x="64" y="124" width="1472" height="812" class="panel"/>

