  <rect x="92" y="154" width="330" height="752" class="softPanel"/>
  <text x="120" y="196" class="section">Chú thích</text>
  <text x="120" y="222" class="text">Mỗi màu chấm là một trạng thái phòng. Từng tầng được nhóm thành một dải riêng.</text>

  <rect x="120" y="250" width="274" height="76" class="softPanel"/>
  <rect x="138" y="268" width="40" height="40" rx="12" class="roomBase roomAvail"/>
