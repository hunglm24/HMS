  <text x="120" y="681" class="text">Tầng 2: Twin / Deluxe</text>
  <text x="120" y="704" class="text">Tầng 3: Suite / Family</text>
  <text x="120" y="727" class="text">Tầng 4: Premium / VIP</text>

  <text x="120" y="782" class="section">Gợi ý</text>
  <text x="120" y="808" class="text">Bộ lọc ở khung bên phải có thể đổi theo tầng, loại phòng và trạng thái.</text>
