<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; rx: 18; ry: 18; }
      .soft { fill: #f9fbff; stroke: #cfd8e3; stroke-width: 2; rx: 16; ry: 16; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #2563eb; letter-spacing: 1px; }
      .label { font: 600 16px Arial, sans-serif; fill: #374151; }
      .text { font: 400 15px Arial, sans-serif; fill: #6b7280; }
      .text-dark { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #6b7280; }
      .chip { fill: #eaf2ff; stroke: #b8c9ff; stroke-width: 1.5; rx: 999; ry: 999; }
      .accent { fill: #2563eb; }
      .muted-line { stroke: #d7deea; stroke-width: 2; }
      .dash { stroke: #9aa8bb; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
      .grid-box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; rx: 16; ry: 16; }
      .button { fill: #2563eb; rx: 14; ry: 14; }
      .button-secondary { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; rx: 14; ry: 14; }
      .button-text { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .button-text-dark { font: 700 16px Arial, sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1020"/>

  <!-- Header -->
  <text x="64" y="58" class="subtitle">LỄ TÂN</text>
  <text x="64" y="104" class="title">Cập nhật đặt phòng: WLK-1787106852859</text>
  <rect x="1400" y="34" width="136" height="54" class="button-secondary"/>
  <text x="1468" y="68" text-anchor="middle" class="button-text-dark">Quay lại</text>

  <!-- Main container -->
  <rect x="52" y="140" width="1496" height="832" class="panel"/>

  <!-- Section headings -->
  <text x="84" y="190" class="text-dark">1. Thông tin booking</text>
  <text x="900" y="190" class="text-dark">2. Sửa phòng trong booking</text>
  <text x="900" y="218" class="text">
    Chọn từng dòng phòng bên trái, rồi gán phòng mới từ danh sách bên phải.
  </text>

  <!-- Left: booking info -->
  <rect x="84" y="236" width="720" height="330" class="soft"/>

  <!-- booking info cards -->
  <rect x="108" y="260" width="318" height="92" class="grid-box"/>
  <text x="128" y="292" class="label">Tên khách hàng</text>
  <text x="128" y="326" class="text-dark">Nguyễn Văn Huy</text>

  <rect x="454" y="260" width="318" height="92" class="grid-box"/>
  <text x="474" y="292" class="label">Số điện thoại</text>
  <text x="474" y="326" class="text-dark">0859326040</text>

  <rect x="108" y="370" width="318" height="92" class="grid-box"/>
  <text x="128" y="402" class="label">Ngày nhận phòng</text>
  <text x="128" y="436" class="text-dark">08/21/2026</text>

  <rect x="454" y="370" width="318" height="92" class="grid-box"/>
  <text x="474" y="402" class="label">Ngày trả phòng</text>
  <text x="474" y="436" class="text-dark">08/22/2026</text>

  <rect x="108" y="480" width="664" height="70" class="grid-box"/>
  <text x="128" y="510" class="label">Lý do sửa đổi</text>
  <text x="128" y="536" class="text">Ví dụ: Khách yêu cầu đổi lịch / Nâng cấp phòng</text>

  <!-- Left: booking rooms list -->
  <text x="84" y="622" class="text-dark">Danh sách phòng trong booking</text>
  <text x="84" y="648" class="text">Mỗi card là 1 booking_room. Bấm để chọn dòng cần đổi.</text>

  <rect x="84" y="666" width="720" height="274" class="soft"/>

  <!-- room line 1 -->
  <rect x="108" y="692" width="676" height="70" class="grid-box"/>
  <rect x="122" y="706" width="112" height="24" class="chip"/>
  <text x="178" y="723" text-anchor="middle" class="small">Phòng 1</text>
  <text x="252" y="723" class="text-dark">Phòng 203</text>
  <text x="252" y="745" class="text">DELUXE</text>
  <text x="650" y="723" text-anchor="end" class="text-dark">Đang gán: Phòng 203</text>
  <text x="650" y="745" text-anchor="end" class="small">200 đ / đêm</text>

  <!-- room line 2 -->
  <rect x="108" y="774" width="676" height="70" class="grid-box"/>
  <rect x="122" y="788" width="112" height="24" class="chip"/>
  <text x="178" y="805" text-anchor="middle" class="small">Phòng 2</text>
  <text x="252" y="805" class="text-dark">Phòng 301</text>
  <text x="252" y="827" class="text">SUITE</text>
  <text x="650" y="805" text-anchor="end" class="text-dark">Đang gán: Phòng 301</text>
  <text x="650" y="827" text-anchor="end" class="small">200 đ / đêm</text>

  <!-- room line 3 -->
  <rect x="108" y="856" width="676" height="70" class="grid-box"/>
  <rect x="122" y="870" width="112" height="24" class="chip"/>
  <text x="178" y="887" text-anchor="middle" class="small">Phòng 3</text>
  <text x="252" y="887" class="text-dark">Phòng 103</text>
  <text x="252" y="909" class="text">DELUXE</text>
  <text x="650" y="887" text-anchor="end" class="text-dark">Đang gán: Phòng 103</text>
  <text x="650" y="909" text-anchor="end" class="small">200 đ / đêm</text>

  <!-- Right: picker panel -->
  <rect x="888" y="236" width="540" height="704" class="soft"/>

  <!-- filter row -->
  <text x="912" y="272" class="label">Loại phòng</text>
  <rect x="912" y="286" width="260" height="48" class="grid-box"/>
  <text x="932" y="317" class="text-dark">Tất cả loại phòng</text>
  <rect x="1190" y="286" width="214" height="48" class="button-secondary"/>
  <text x="1297" y="317" text-anchor="middle" class="button-text-dark">Tìm phòng trống</text>

  <!-- helper note -->
  <rect x="912" y="352" width="494" height="90" class="soft"/>
  <text x="932" y="382" class="label">Gợi ý thao tác</text>
  <text x="932" y="408" class="text">1. Chọn 1 card ở danh sách bên trái.</text>
  <text x="932" y="430" class="text">2. Click phòng trống bên phải để gán.</text>

  <!-- room picker grid -->
  <text x="912" y="482" class="label">Danh sách phòng trống</text>
  <rect x="912" y="502" width="154" height="122" class="grid-box"/>
  <text x="989" y="546" text-anchor="middle" class="text-dark">Phòng 101</text>
  <text x="989" y="574" text-anchor="middle" class="text">STANDARD</text>
  <text x="989" y="610" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">1,000 đ</text>

  <rect x="1080" y="502" width="154" height="122" class="grid-box"/>
  <text x="1157" y="546" text-anchor="middle" class="text-dark">Phòng 201</text>
  <text x="1157" y="574" text-anchor="middle" class="text">TWIN</text>
  <text x="1157" y="610" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">200 đ</text>

  <rect x="1248" y="502" width="154" height="122" class="grid-box"/>
  <text x="1325" y="546" text-anchor="middle" class="text-dark">Phòng 203</text>
  <text x="1325" y="574" text-anchor="middle" class="text">DELUXE</text>
  <text x="1325" y="610" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">200 đ</text>

  <rect x="912" y="638" width="154" height="122" class="grid-box"/>
  <text x="989" y="682" text-anchor="middle" class="text-dark">Phòng 301</text>
  <text x="989" y="710" text-anchor="middle" class="text">SUITE</text>
  <text x="989" y="746" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">200 đ</text>

  <rect x="1080" y="638" width="154" height="122" class="grid-box"/>
  <text x="1157" y="682" text-anchor="middle" class="text-dark">Phòng 302</text>
  <text x="1157" y="710" text-anchor="middle" class="text">SUITE</text>
  <text x="1157" y="746" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">200 đ</text>

  <rect x="1248" y="638" width="154" height="122" class="grid-box"/>
  <text x="1325" y="682" text-anchor="middle" class="text-dark">Phòng 303</text>
  <text x="1325" y="710" text-anchor="middle" class="text">FAMILY</text>
  <text x="1325" y="746" text-anchor="middle" class="accent" style="font:700 16px Arial,sans-serif;">200 đ</text>

  <!-- sticky save action -->
  <rect x="912" y="790" width="490" height="88" class="panel"/>
  <text x="932" y="822" class="label">Tổng quan</text>
  <text x="932" y="848" class="text">Hiển thị số phòng đã sửa, số phòng còn giữ nguyên, và cảnh báo trùng phòng.</text>
  <rect x="1218" y="812" width="160" height="52" class="button"/>
  <text x="1298" y="845" text-anchor="middle" class="button-text">Lưu thay đổi</text>

  <!-- Responsive note -->
  <text x="84" y="972" class="small">Wireframe gợi ý: desktop 2 cột. Ở mobile, panel phòng bên phải sẽ rơi xuống dưới danh sách phòng.</text>
</svg>
